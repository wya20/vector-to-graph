services:
  vector-to-graph:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./src:/app/src
    environment:
      - QDRANT_URL=http://qdrant:6333
      - GRAPH_STORAGE_PATH=/app/data/graphs
      - VECTOR_STORAGE_PATH=/app/data/vectors
      - RAW_DATA_PATH=/app/data/raw
      - LOG_LEVEL=INFO
    depends_on:
      - qdrant
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped
