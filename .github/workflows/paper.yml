name: Compile Paper PDF

on:
  push:
    paths:
      - 'papers/**'
      - '.github/workflows/paper.yml'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: vector_to_graph_paper.tex
          working_directory: papers
          latexmk_use_xelatex: true
          args: "-pdfxe -bibtex -interaction=nonstopmode"
          pre_compile: |
            sed -i 's/SimSun/Noto Serif CJK SC/g' papers/vector_to_graph_paper.tex

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: paper
          path: papers/vector_to_graph_paper.pdf
