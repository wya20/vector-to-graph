[project]
name = "vector-to-graph"
version = "0.3.0"
description = "Hybrid search system combining vector similarity and graph knowledge"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "qdrant-client>=1.7.0",
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
    "networkx>=3.2",
    "graspologic>=3.3.0",
    "tree-sitter>=0.20.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "watchdog>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
